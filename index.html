<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ObDev</title>
  <meta name="description" content="yapper: obdev">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #14152b;
      --card: #fffdf9;
      --cobalt: #2d3bf0;
      --sun: #ffc52e;
      --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px;
      background-color: var(--sun);
      background-image: radial-gradient(rgba(20, 21, 43, 0.2) 1.5px, transparent 1.6px);
      background-size: 14px 14px;
      color: var(--ink);
      font-family: var(--font);
    }

    .hero {
      width: min(980px, 100%);
      margin: 0 auto;
    }

    /* Big wordmark, tightly set */
    .title {
      margin: 0;
      font-size: clamp(72px, 17vw, 190px);
      font-weight: 800;
      line-height: 0.88;
      letter-spacing: -0.05em;
    }

    /* Same chat-bubble language as the profile page */
    .bubble {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 22px;
      background: var(--cobalt);
      color: var(--card);
      border-radius: 26px 26px 26px 6px;
      font-size: clamp(18px, 2.4vw, 24px);
      font-weight: 600;
    }

    .cta {
      display: inline-block;
      margin-top: 32px;
      padding: 16px 26px;
      background: var(--ink);
      color: var(--card);
      border-radius: 14px;
      font: 800 18px/1 var(--font);
      text-decoration: none;
      transition: background-color 0.15s ease;
    }

    .cta:hover { background: #2c2e52; }

    .cta:focus-visible {
      outline: 3px solid var(--cobalt);
      outline-offset: 3px;
    }

    @media (max-width: 640px) {
      body { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <h1 class="title">ObDev</h1>
    <p class="bubble">yapper: obdev</p>
    <br>
    <a class="cta" href="@obdev/">Go to @obdev</a>
  </main>
</body>
</html>
